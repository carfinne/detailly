name: XRechnung - KoSIT Validation

# Validiert eine aus dem ECHTEN Builder erzeugte XRechnung gegen den offiziellen
# KoSIT-Validator (Schematron EN16931 + XRechnung 3.0.x). Das ist der finale
# Konformitaets-Gate vor dem Go-Live, den die reine Regelanalyse nicht ersetzen kann.
#
# Echtes Merge-Gate fuer e-invoice-Aenderungen: der Job schlaegt fehl, wenn der
# KoSIT-Validator die aus dem Builder erzeugte XRechnung ABLEHNT (Exitcode != 0
# bzw. "Rejected"). Greift nur bei PRs, die e-invoice/den Generator/diesen
# Workflow beruehren (paths-Filter). Bei transienter Download-Stoerung: erneut laufen.

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/e-invoice/**'
      - 'backend/scripts/gen-xrechnung-sample.js'
      - '.github/workflows/xrechnung-kosit.yml'
  pull_request:
    paths:
      - 'backend/src/e-invoice/**'
      - 'backend/scripts/gen-xrechnung-sample.js'
      - '.github/workflows/xrechnung-kosit.yml'
  workflow_dispatch: {}

# Feste, per GitHub-API verifizierte Release-Artefakte (Stand 2026-07).
env:
  KOSIT_VALIDATOR_URL: https://github.com/itplr-kosit/validator/releases/download/v1.6.2/validator-1.6.2-standalone.jar
  KOSIT_CONFIG_URL: https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v2026-01-31/xrechnung-3.0.2-validator-configuration-2026-01-31.zip

jobs:
  kosit:
    name: XRechnung - KoSIT Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build backend (erzeugt dist/)
        working-directory: ./backend
        run: npm run build

      - name: Sample-XRechnungen aus dem Builder erzeugen (19 % + §19-Kleinunternehmer + 384-Storno + Schlussrechnung mit Anzahlungsabzug)
        working-directory: ./backend
        run: node scripts/gen-xrechnung-sample.js

      - name: Setup Java (fuer KoSIT-Validator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: KoSIT-Validator + XRechnung-3.0-Konfiguration laden
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o validator.jar "$KOSIT_VALIDATOR_URL"
          curl -sSL --retry 3 -o config.zip "$KOSIT_CONFIG_URL"
          mkdir -p kosit-config
          unzip -q config.zip -d kosit-config
          echo "Gefundene scenarios.xml:"
          find kosit-config -name scenarios.xml

      - name: Validieren (EN16931 + XRechnung 3.0)
        run: |
          set -uo pipefail
          SCEN="$(find kosit-config -name scenarios.xml | head -1)"
          REPO="$(dirname "$SCEN")"
          mkdir -p kosit-out
          echo "scenarios: $SCEN   repository: $REPO"
          # Der KoSIT-Validator exitet != 0, wenn ein Dokument ABGELEHNT wird.
          # ALLE vier Beispiele in EINEM Lauf pruefen: 19 % (Kategorie S),
          # §19-Kleinunternehmer (Kategorie E), die 384-Rechnungskorrektur
          # (Storno, negative Summen + BillingReference) UND die Schlussrechnung
          # mit Anzahlungsabzug (Typ 380 mit NEGATIVER Zeile -> BR-27 auf einer
          # normalen Rechnung). Ausgabe mitschneiden -> Accept/Reject/Warn-Auswertung.
          set +e
          java -jar validator.jar -r "$REPO" -s "$SCEN" -o kosit-out \
            backend/sample.xrechnung.xml \
            backend/sample.xrechnung.kleinunternehmer.xml \
            backend/sample.xrechnung.storno.xml \
            backend/sample.xrechnung.schlussrechnung.xml | tee kosit-out/validate.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "Validator-Exitcode: $RC"
          # Nicht-fatale Hinweise/Warnungen sichtbar machen (kein Fail).
          if grep -qiE 'BR-DE-TMP|warning|hinweis' kosit-out/validate.log; then
            echo "::warning::KoSIT meldete nicht-fatale Hinweise/Warnungen - siehe Log/Artefakt."
          fi
          # Fail nur bei echter Ablehnung (Exitcode oder "Rejected: N>0" / "Validation failed").
          if [ "$RC" -ne 0 ] || grep -qiE 'Rejected:[[:space:]]*[1-9]|Validation failed' kosit-out/validate.log; then
            echo "::error::XRechnung wurde vom KoSIT-Validator ABGELEHNT."
            exit 1
          fi
          echo "XRechnung wurde vom KoSIT-Validator AKZEPTIERT (Validation successful)."

      - name: KoSIT-Report als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosit-report
          path: kosit-out
          if-no-files-found: warn
