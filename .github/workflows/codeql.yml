# CodeQL – statische Sicherheitsanalyse fuer JavaScript/TypeScript (Luecke 1c).
#
# ENTSCHEIDUNG "CodeQL ja/nein": JA, ergaenzt.
# Begruendung:
#   * Das Repository ist OEFFENTLICH (public) -> GitHub Code Scanning inkl. CodeQL
#     ist dafuer kostenlos, der SARIF-Upload (security-events: write) funktioniert
#     ohne GitHub Advanced Security. (Bei einem PRIVATEN Repo ohne GHAS wuerde der
#     Upload-Schritt fehlschlagen – dann waere die Empfehlung anders.)
#   * JavaScript/TypeScript ist eine interpretierte Sprache -> `build-mode: none`,
#     es wird NICHTS kompiliert. Der Lauf bleibt dadurch schnell und robust (kein
#     better-sqlite3-/Next-Build noetig, keine der lokalen Build-Fallen).
#   * Es laeuft die DEFAULT-Query-Suite (nicht security-extended), um das Rauschen
#     gering zu halten – lieber wenige, belastbare Befunde als eine Flut, die keiner
#     durchsieht. Bei Bedarf kann der Betreiber spaeter `queries: security-extended`
#     ergaenzen.
#
# Laueft bei Push/PR gegen main (Befunde erscheinen als PR-Annotation) und
# zusaetzlich woechentlich (faengt neu bekannt gewordene Muster in altem Code).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Montags 07:00 UTC (versetzt zum npm-audit-Wochenlauf um 06:00).
    - cron: "0 7 * * 1"

# Nur EINE Analyse je Ref gleichzeitig (spart Minuten bei schnellen Nach-Pushes).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
