<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D11" />
    <title>Offline · Detailly</title>
    <!--
      Statische Offline-Seite. Bewusst OHNE externe Abhaengigkeiten (kein JS-Chunk,
      keine Schrift-CDN, alle Stile inline), damit sie garantiert ohne Netz laedt.
      Der Service-Worker legt sie beim Install in den Cache und liefert sie als
      Fallback fuer Navigationsanfragen, wenn das Geraet offline ist.
    -->
    <style>
      :root {
        --ink-900: #0b0d11;
        --ink-850: #101319;
        --ink-700: #232936;
        --chrome-50: #f4f6fa;
        --chrome-300: #a6aebe;
        --chrome-400: #8a93a6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: var(--ink-900);
        background-image:
          radial-gradient(1200px 600px at 80% -10%, rgba(232, 146, 59, 0.06), transparent 60%),
          radial-gradient(900px 500px at -10% 110%, rgba(232, 146, 59, 0.03), transparent 55%);
        color: var(--chrome-50);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .tile {
        display: grid;
        place-items: center;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.1rem;
        background: linear-gradient(135deg, #f2b877 0%, #e8923b 45%, #d27c26 100%);
        color: #070809;
        box-shadow: 0 0 0 1px rgba(232, 146, 59, 0.35), 0 8px 30px -8px rgba(232, 146, 59, 0.25);
        animation: breathe 3.2s ease-in-out infinite;
      }
      .tile svg { width: 2.4rem; height: 2.4rem; }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.55;
        color: var(--chrome-300);
      }
      .status {
        font-size: 0.8rem;
        color: var(--chrome-400);
        min-height: 1.2rem;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.4rem;
        border-radius: 0.75rem;
        color: #070809;
        background: linear-gradient(135deg, #f2b877 0%, #e8923b 45%, #d27c26 100%);
        box-shadow: 0 0 0 1px rgba(232, 146, 59, 0.35), 0 8px 24px -10px rgba(232, 146, 59, 0.35);
        transition: filter 0.15s ease, transform 0.1s ease;
      }
      button:hover { filter: brightness(1.05); }
      button:active { transform: translateY(1px); filter: brightness(0.97); }
      button:focus-visible { outline: 2px solid #e8923b; outline-offset: 3px; }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.92; }
      }
      @media (prefers-reduced-motion: reduce) {
        .tile { animation: none; }
        button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" />
          <path d="M5 11h14a2 2 0 0 1 2 2v3a1 1 0 0 1-1 1h-1M5 11a2 2 0 0 0-2 2v3a1 1 0 0 0 1 1h1" />
          <circle cx="7.5" cy="16.5" r="1.1" />
          <circle cx="16.5" cy="16.5" r="1.1" />
        </svg>
      </div>
      <h1>Keine Verbindung</h1>
      <p>
        Detailly ist gerade offline. Sobald wieder eine Internetverbindung
        besteht, laden wir die Seite automatisch neu.
      </p>
      <p class="status" id="status" aria-live="polite"></p>
      <button type="button" id="retry">Erneut versuchen</button>
    </main>
    <script>
      (function () {
        var status = document.getElementById('status');
        var retry = document.getElementById('retry');
        function reload() { window.location.reload(); }
        if (retry) retry.addEventListener('click', reload);
        // Kommt das Netz zurueck, automatisch neu laden.
        window.addEventListener('online', function () {
          if (status) status.textContent = 'Verbindung wieder da – lädt neu …';
          reload();
        });
        window.addEventListener('offline', function () {
          if (status) status.textContent = 'Weiterhin offline.';
        });
        if (status && navigator.onLine === false) {
          status.textContent = 'Weiterhin offline.';
        }
      })();
    </script>
  </body>
</html>
